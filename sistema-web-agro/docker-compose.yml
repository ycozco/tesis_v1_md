version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: agro_db
    restart: always
    environment:
      POSTGRES_DB: agro_audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agro_audit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agro_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/agro_audit
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
      - APP_MODE=EXPERIMENT
    volumes:
      - ../data:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agro_frontend
    restart: always
    ports:
      - "8050:8050"
    depends_on:
      - backend

  backend_fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile.fastapi
    container_name: agro_backend_fastapi
    restart: always
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/agro_audit
      - APP_MODE=EXPERIMENT
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
