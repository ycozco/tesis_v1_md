name: agroscope-local
services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: agro_scope
      POSTGRES_USER: agroscope
      POSTGRES_PASSWORD: ${AGRO_DB_PASSWORD:-agroscope-local-db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U agroscope -d agro_scope']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: ..
      dockerfile: sistema-web-agro/backend/Dockerfile.local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://agroscope:${AGRO_DB_PASSWORD:-agroscope-local-db}@db:5432/agro_scope
      LOCAL_USERNAME: ${AGRO_LOCAL_USERNAME:-revision-ui}
      LOCAL_PASSWORD: ${AGRO_LOCAL_PASSWORD:-SoloRevisionLocal2026!}
      RESEARCH_ALLOW_LOCAL_AI: 'false'
      RESEARCH_ALLOW_PAID_AI: 'false'
    volumes:
      - research_state:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:${AGRO_WEB_PORT:-8050}:8050'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8050/health']
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  postgres_data:
  research_state:
