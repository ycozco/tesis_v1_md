<!DOCTYPE html>
<html>
<head>
    <title>404 - No encontrado</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            text-align: center;
            padding: 80px 20px;
            background: #0f172a;
            color: #f8fafc;
        }
        h1 { color: #ef4444; font-size: 3rem; margin-bottom: 20px; }
        p { color: #94a3b8; font-size: 1.2rem; margin-bottom: 30px; }
        a {
            color: #6366f1;
            text-decoration: none;
            border: 1px solid rgba(99, 102, 241, 0.4);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
        }
        a:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: #6366f1;
        }
    </style>
</head>
<body>
    <h1>404 - Documento no encontrado</h1>
    <p>El documento solicitado no existe o se ha movido.</p>
    <p><a href="/">← Volver al inicio</a></p>
</body>
</html>
